version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/assets"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

  - package-ecosystem: "mix"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14
