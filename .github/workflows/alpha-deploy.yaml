name: Snowflake Deploy

on:
  push:
    tags:
    - v*-alpha

env:
  PROJECT_ID: ${{ secrets.GCE_PROJECT }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment:
      name: alpha
    permissions:
      contents: write #lets the workflow read and write the repository's code. Needed here to push the new bump-version branch
      id-token: write
      pull-requests: write  # Required for PR actions

    env:
      GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
      GCE_INSTANCE_ZONE: us-east4-c


    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0  #tells it to fetch the complete git history. We need because version extraction relies on reading the git tag (GITHUB_REF), and tags are part of the full history.

    - name: Extract tag version and update mix.exs
      id: update_mix
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

        sed -i.bak -E "s/(version:\s*\")[^\"]+\"/\1${VERSION}\"/" mix.exs
        rm mix.exs.bak
        echo "Updated mix.exs to version $VERSION"

    - name: Create Pull Request to update version
      run: |
        VERSION="${{ env.VERSION }}"
        BRANCH="bump-version-to-${VERSION}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add mix.exs
        git commit -m "chore: bump version to $VERSION from tag"
        git push origin "$BRANCH"

        sleep 5
        gh pr create \
          --base develop \
          --head "$BRANCH" \
          --title "chore: bump version to $VERSION from tag" \
          --body "This PR updates \`mix.exs\` to version \`$VERSION\` from tag \`$GITHUB_REF_NAME\`"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Enable auto-merge once checks pass
      run: |
        VERSION="${{ env.VERSION }}"
        PR_URL=$(gh pr view bump-version-to-${VERSION} --json url -q .url)
        echo "Enabling auto-merge on PR: $PR_URL"
        gh pr merge "$PR_URL" --auto --squash

      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - id: "auth"
      uses: "google-github-actions/auth@v2"
      with:
        credentials_json: ${{ secrets.GCE_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v2
      with:
        version: "506.0.0"



    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker

    # Build the Docker image
    # the `GITHUB_REF` will fetch the tag ref responsible for triggering the action.
    # using `${GITHUB_REF##*/}` gets the tag used i.e v0.8.7-alpha. Check the link for more information
    # https://stackoverflow.com/questions/9532654/expression-after-last-specific-character
    - name: Build
      run: |
        echo '${{ secrets.RELEASES_SECRETS }}' >> config/releases.exs
        echo '${{ secrets.QNA_ANSWERS }}' >> qna/answers.json
        echo '${{ secrets.COURSES_ANSWERS }}' >> courses/answers.json
        docker build --tag "gcr.io/duncan-openc2-plugfest/quadquiz:${GITHUB_REF_NAME}" .

    # Push the Docker image to Google Container Registry
    - name: Publish
      run: |-
        docker push "gcr.io/duncan-openc2-plugfest/quadquiz:${GITHUB_REF_NAME}"

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: quadquiz-alpha
        region: us-east4
        image: "gcr.io/duncan-openc2-plugfest/quadquiz:${{ github.ref_name }}"
